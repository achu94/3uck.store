name: Build and Push Docker Image

on:
    push:
        branches: [dev, test, main]
    pull_request:
        branches: [dev, main]

jobs:
    checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: TypeScript check
              run: npm run check:type

            - name: Lint check
              run: npm run check:lint

    build:
        runs-on: ubuntu-latest
        needs: checks
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                build-args: |
                  NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
                  NEXT_PUBLIC_USER_ASSET_URL=${{ secrets.NEXT_PUBLIC_USER_ASSET_URL }}
                  NEXT_PUBLIC_STORE_ASSET_URL=${{ secrets.NEXT_PUBLIC_STORE_ASSET_URL }}
                  NEXT_PUBLIC_ITEMS_ASSET_URL=${{ secrets.NEXT_PUBLIC_ITEMS_ASSET_URL }}
                  NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
                  NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
                  AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
                  AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
